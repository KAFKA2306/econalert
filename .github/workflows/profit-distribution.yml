name: U.S. profit distribution

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_profit_distribution.py'
      - 'scripts/build_profit_distribution_views.py'
      - 'data/official/bls-profit-distribution-series-contract.json'
      - 'tests/test_profit_distribution.py'
      - '.github/workflows/profit-distribution.yml'
  pull_request:
    paths:
      - 'scripts/collect_profit_distribution.py'
      - 'scripts/build_profit_distribution_views.py'
      - 'data/official/bls-profit-distribution-series-contract.json'
      - 'tests/test_profit_distribution.py'
      - '.github/workflows/profit-distribution.yml'
  schedule:
    - cron: '50 14 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m pip install pytest && python -m pytest -q tests/test_profit_distribution.py
      - name: Verify live data endpoints
        if: github.event_name == 'pull_request'
        run: python scripts/collect_profit_distribution.py --output-dir /tmp/us-profit-distribution-current
      - name: Collect current snapshot
        if: github.event_name != 'pull_request'
        run: python scripts/collect_profit_distribution.py
      - name: Build distribution files
        if: github.event_name != 'pull_request'
        run: python scripts/build_profit_distribution_views.py
      - name: Commit evidence and views
        if: github.event_name != 'pull_request'
        run: |
          if test -z "$(git status --porcelain -- data/official/us-profit-distribution-current api/v1/profit-distribution)"; then
            echo 'No U.S. profit/distribution source or view changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official/us-profit-distribution-current api/v1/profit-distribution
          git commit -m 'data: update U.S. profit distribution'
          git push
