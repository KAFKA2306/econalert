name: Data integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile scripts/build_public_api.py tests/test_public_api.py
      - name: Rebuild API
        run: python scripts/build_public_api.py
      - name: Test
        run: python -m pytest -q
      - name: Ensure committed distribution is deterministic
        run: git diff --exit-code -- api/v1
      - name: JSON smoke test
        run: python -m json.tool api/v1/manifest.json >/dev/null && python -m json.tool api/v1/latest.json >/dev/null && python -m json.tool api/v1/categories.json >/dev/null
