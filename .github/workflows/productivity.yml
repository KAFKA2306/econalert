name: BLS productivity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_productivity.py'
      - 'scripts/build_productivity_views.py'
      - 'data/official/bls-productivity-vintages.json'
      - 'data/official/bls-productivity-2026-q2-release.json'
      - 'tests/test_productivity_collector.py'
      - '.github/workflows/productivity.yml'
  pull_request:
    paths:
      - 'scripts/collect_productivity.py'
      - 'scripts/build_productivity_views.py'
      - 'data/official/bls-productivity-vintages.json'
      - 'data/official/bls-productivity-2026-q2-release.json'
      - 'tests/test_productivity_collector.py'
      - '.github/workflows/productivity.yml'
  schedule:
    - cron: '20 14 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m pip install pytest && python -m pytest -q tests/test_productivity_collector.py
      - name: Verify BLS Public Data API
        if: github.event_name == 'pull_request'
        run: python scripts/collect_productivity.py --output-dir /tmp/bls-productivity-current
      - name: Verify release-aware public projection
        if: github.event_name == 'pull_request'
        run: |
          rm -rf /tmp/productivity-public
          python scripts/build_productivity_views.py --output-dir /tmp/productivity-public
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('/tmp/productivity-public/latest.json').read_text())
          release=json.loads(Path('/tmp/productivity-public/release.json').read_text())
          assert latest['observations'][-1]['period']=='2026-Q2'
          assert latest['release']['release_date']=='2026-08-06'
          assert latest['release']['release_status']=='preliminary'
          assert latest['release']['next_release']['release_status']=='revised'
          assert release['headline']['labor_productivity']==latest['observations'][-1]['labor_productivity']
          PY
      - name: Collect current BLS productivity snapshot
        if: github.event_name != 'pull_request'
        run: python scripts/collect_productivity.py
      - name: Build distribution files
        if: github.event_name != 'pull_request'
        run: python scripts/build_productivity_views.py
      - name: Commit evidence and views
        if: github.event_name != 'pull_request'
        run: |
          if test -z "$(git status --porcelain -- data/official/bls-productivity-current api/v1/productivity)"; then
            echo 'No BLS productivity source or view changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official/bls-productivity-current api/v1/productivity
          git commit -m 'data: update BLS productivity views'
          git push
