name: BLS productivity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_productivity.py'
      - 'scripts/collect_productivity_vintages.py'
      - 'tests/test_productivity_collector.py'
      - '.github/workflows/productivity.yml'
  pull_request:
    paths:
      - 'scripts/collect_productivity.py'
      - 'scripts/collect_productivity_vintages.py'
      - 'tests/test_productivity_collector.py'
      - '.github/workflows/productivity.yml'
  schedule:
    - cron: '20 14 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m pip install pytest && python -m pytest -q tests/test_productivity_collector.py
      - name: Verify live BLS sources
        if: github.event_name == 'pull_request'
        run: |
          python scripts/collect_productivity.py --output-dir /tmp/bls-productivity-current
          python scripts/collect_productivity_vintages.py --output /tmp/bls-productivity-vintages.json
      - name: Collect official BLS productivity data
        if: github.event_name != 'pull_request'
        run: |
          python scripts/collect_productivity.py
          python scripts/collect_productivity_vintages.py
      - name: Commit source changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/official/bls-productivity-current data/official/bls-productivity-vintages.json; then
            echo 'No BLS productivity source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official/bls-productivity-current data/official/bls-productivity-vintages.json
          git commit -m 'data: update BLS productivity releases'
          git push
