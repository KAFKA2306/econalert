name: BLS productivity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_productivity.py'
      - 'data/official/bls-productivity-vintages.json'
      - 'tests/test_productivity_collector.py'
      - '.github/workflows/productivity.yml'
  pull_request:
    paths:
      - 'scripts/collect_productivity.py'
      - 'data/official/bls-productivity-vintages.json'
      - 'tests/test_productivity_collector.py'
      - '.github/workflows/productivity.yml'
  schedule:
    - cron: '20 14 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m pip install pytest && python -m pytest -q tests/test_productivity_collector.py
      - name: Verify BLS Public Data API
        if: github.event_name == 'pull_request'
        run: python scripts/collect_productivity.py --output-dir /tmp/bls-productivity-current
      - name: Collect current BLS productivity snapshot
        if: github.event_name != 'pull_request'
        run: python scripts/collect_productivity.py
      - name: Commit new API snapshot
        if: github.event_name != 'pull_request'
        run: |
          if test -z "$(git status --porcelain -- data/official/bls-productivity-current)"; then
            echo 'No BLS productivity source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official/bls-productivity-current
          git commit -m 'data: update BLS productivity snapshot'
          git push
